repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        language: system
        files: \.(ts|tsx|js|jsx)$
        entry: pnpm oxlint -c ./oxlint.config.ts
      - id: format
        name: format
        language: system
        files: \.(ts|tsx|js|jsx|json)$
        entry: pnpm oxfmt --check
